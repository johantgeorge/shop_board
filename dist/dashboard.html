<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopBoard</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <p class="eyebrow">ShopBoard</p>
          <h1>Folders</h1>
          <p class="muted">Organize products into lightweight local boards.</p>
        </div>

        <div class="sidebar-actions">
          <button id="add-folder-button" class="secondary-button" type="button">Add Folder</button>
        </div>

        <div id="folder-list" class="folder-list" aria-label="Folders"></div>
      </aside>

      <main class="main-panel">
        <section class="list-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Items</p>
              <h2 id="item-panel-title">Selected Folder</h2>
            </div>
            <div class="stats">
              <span id="item-count">0 items</span>
              <span id="item-total">Total: $0.00</span>
            </div>
          </div>

          <div id="item-list" class="item-list" aria-label="Items"></div>

          <button id="new-item-button" class="primary-button" type="button">+ New Item</button>
        </section>

        <section class="detail-panel">
          <div class="panel-header detail-header">
            <div>
              <p class="eyebrow">Details</p>
              <h2 id="detail-title">Choose an item</h2>
            </div>
            <button id="edit-item-button" class="secondary-button" type="button">Edit</button>
          </div>

          <form id="item-form" class="item-form">
            <label>
              <span>Name</span>
              <input id="item-name" name="title" type="text" placeholder="Item name" />
            </label>

            <label>
              <span>Price</span>
              <input id="item-price" name="price" type="number" min="0" step="0.01" placeholder="0.00" />
            </label>

            <label>
              <span>Qty</span>
              <input id="item-quantity" name="quantity" type="number" min="1" step="1" placeholder="1" />
            </label>

            <label>
              <span>URL</span>
              <input id="item-url" name="url" type="url" placeholder="https://example.com/product" />
            </label>

            <label>
              <span>Image URL</span>
              <input id="item-image" name="imageUrl" type="url" placeholder="https://example.com/image.jpg" />
            </label>

            <label>
              <span>Folder</span>
              <select id="item-folder" name="folderId"></select>
            </label>

            <label class="notes-field">
              <span>Notes</span>
              <textarea id="item-notes" name="notes" rows="8" placeholder="Notes, reminders, options..."></textarea>
            </label>

            <div class="form-actions">
              <a id="open-url-link" class="link-button" href="#" target="_blank" rel="noreferrer">Open Product</a>
              <button id="delete-item-button" class="danger-button" type="button">Delete</button>
              <button id="save-item-button" class="primary-button" type="submit">Save</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <template id="folder-card-template">
      <button class="folder-card" type="button">
        <span class="folder-name"></span>
        <span class="folder-meta"></span>
      </button>
    </template>

    <template id="item-card-template">
      <button class="item-card" type="button">
        <span class="item-card-title"></span>
        <span class="item-card-meta"></span>
      </button>
    </template>

    <script src="dashboard.js"></script>
  </body>
</html>
