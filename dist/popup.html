<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopBoard</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-shell">
      <section id="folder-view" class="view-panel">
        <div class="toolbar">
          <p class="eyebrow">ShopBoard</p>
          <button id="add-folder-button" class="secondary-button" type="button">Add Folder</button>
        </div>

        <form id="folder-create-form" class="inline-form is-hidden">
          <input id="folder-name-input" name="folderName" type="text" placeholder="New folder name" />
          <div class="inline-form-actions">
            <button id="cancel-folder-button" class="secondary-button compact-button" type="button">Cancel</button>
            <button class="primary-button compact-button" type="submit">Create</button>
          </div>
        </form>

        <div id="folder-list" class="card-list" aria-label="Folders"></div>
      </section>

      <section id="items-view" class="view-panel is-hidden">
        <div class="section-head">
          <button data-back-button class="icon-button compact-button" type="button" aria-label="Go back">Back</button>
          <div>
            <p class="eyebrow">Items</p>
            <h2 id="items-folder-title">Selected Folder</h2>
          </div>
          <button id="new-item-button" class="primary-button compact-button" type="button">+ New Item</button>
        </div>

        <div class="stats-bar">
          <span id="item-count">0 items</span>
          <span id="item-total">Total: $0.00</span>
        </div>

        <div id="item-list" class="card-list compact-list" aria-label="Items"></div>
      </section>

      <section id="form-view" class="view-panel is-hidden">
        <div class="section-head">
          <button data-back-button class="icon-button compact-button" type="button" aria-label="Go back">Back</button>
          <div>
            <p class="eyebrow">Save Product</p>
            <h2 id="form-title">New Item</h2>
          </div>
          <button id="home-button" class="secondary-button compact-button" type="button">Home</button>
        </div>

        <div id="scrape-status" class="scrape-status is-hidden" aria-live="polite"></div>

        <form id="item-form" class="item-form">
          <label>
            <span>Name</span>
            <input id="item-name" name="title" type="text" placeholder="Item name" />
          </label>

          <div class="input-row">
            <label>
              <span>Price</span>
              <input id="item-price" name="price" type="number" min="0" step="0.01" placeholder="0.00" />
            </label>

            <label>
              <span>Qty</span>
              <input id="item-quantity" name="quantity" type="number" min="1" step="1" placeholder="1" />
            </label>
          </div>

          <label>
            <span>URL</span>
            <input id="item-url" name="url" type="url" placeholder="https://example.com/product" />
          </label>

          <label class="folder-field">
            <span>Folder</span>
            <input id="item-folder" name="folderId" type="hidden" />
            <div id="folder-picker" class="folder-picker">
              <button
                id="folder-picker-button"
                class="folder-picker-button"
                type="button"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span id="folder-picker-label" class="folder-picker-label">Select a folder</span>
                <span class="select-chevron" aria-hidden="true">▾</span>
              </button>
              <div id="folder-picker-menu" class="folder-picker-menu is-hidden" role="listbox" aria-label="Folder options"></div>
            </div>
            <span id="folder-field-meta" class="field-meta">Choose where this item should be saved.</span>
          </label>

          <label>
            <span>Notes</span>
            <textarea id="item-notes" name="notes" rows="5" placeholder="Notes, reminders, options..."></textarea>
          </label>

          <div class="form-actions">
            <a id="open-url-link" class="link-button" href="#" target="_blank" rel="noreferrer">Open</a>
            <button id="delete-item-button" class="danger-button" type="button">Delete</button>
            <button id="save-item-button" class="primary-button" type="submit">Save</button>
          </div>
        </form>
      </section>
    </div>

    <template id="folder-card-template">
      <div class="card folder-card" role="button" tabindex="0">
        <span class="card-row">
          <span class="card-title"></span>
          <span class="card-price"></span>
        </span>
        <span class="card-row card-subrow">
          <span class="card-meta"></span>
          <button class="folder-delete-button" type="button" aria-label="Delete folder">Delete</button>
        </span>
      </div>
    </template>

    <template id="item-card-template">
      <button class="card item-card" type="button">
        <span class="card-row">
          <span class="card-title"></span>
          <span class="card-price"></span>
        </span>
        <span class="card-meta"></span>
      </button>
    </template>

    <script src="popup.js"></script>
  </body>
</html>
